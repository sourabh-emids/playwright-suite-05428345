[project]
name = "generated-suite"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0",
    "pytest-playwright>=0.5",
    "pytest-bdd>=7.2",
    "pytest-xdist>=3.6",
    "pytest-html>=4.1",
    "python-dotenv>=1.0",
]

[tool.uv]
# This is a test suite, not an installable library -- no src/ package for
# uv to build, so skip project-build/install entirely (`uv sync` would
# otherwise fail looking for one).
package = false
